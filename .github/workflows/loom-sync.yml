name: Sync upstream release

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Yassimba/plannotator' && github.ref == 'refs/heads/loom/current'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: loom/current
          fetch-depth: 0
      - name: Open the release PR and enable checked automerge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/loom-sync.sh
